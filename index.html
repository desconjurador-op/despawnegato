function openCM(c,x,y){cm.innerHTML='';const mkb=(t,fn,cls)=>{const b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=fn;return b};
  const h=document.createElement('h4');h.textContent=c.name?'@'+c.name:'gatinho sem nome';cm.appendChild(h);
  const sw=document.createElement('div');sw.className='sw';FUR.forEach((hx,i)=>{const b=mkb('',()=>{c.f=i;touched();openCM(c,x,y)},c.f%6===i?'on':'');b.style.background=hx;b.setAttribute('aria-label','Cor '+(i+1));sw.appendChild(b)});cm.appendChild(sw);
  const g=document.createElement('div');g.className='g';TYN.forEach(([k,l])=>g.appendChild(mkb(l,()=>{c.ty=k;touched();openCM(c,x,y)},c.ty===k?'on':'')));
  g.appendChild(mkb('✏️ Renomear',()=>{const v=prompt('Novo nome (sem @):',c.name||'');if(v===null)return;const n=cleanName(v);if(!n){toast('Nome inválido');return}
    if(n.toLowerCase()!==(c.name||'').toLowerCase()&&names.has(n.toLowerCase())){toast('Já existe um gatinho com esse nome');return}
    if(c.name)names.delete(c.name.toLowerCase());c.name=n;names.add(n.toLowerCase());touched();openCM(c,x,y)}));
  g.appendChild(mkb('🎥 Seguir',()=>{cm.hidden=true;startFollow(c)}));
  g.appendChild(mkb('🗑 Remover',function(){if(!this.dataset.arm){this.dataset.arm=1;this.textContent='Certeza?';return}cm.hidden=true;removeCat(c);touched()},'danger'));
  g.appendChild(mkb('🚀 Publicar',()=>{cm.hidden=true;publish()}));cm.appendChild(g);
  cm.hidden=false;const W=cm.offsetWidth,H=cm.offsetHeight;cm.style.left=Math.max(6,Math.min(x,innerWidth-W-6))+'px';cm.style.top=Math.max(6,Math.min(y,innerHeight-H-6))+'px'}
cv.addEventListener('contextmenu',e=>{if(!ADM)return;e.preventDefault();const c=catAt(e.clientX,e.clientY);if(c)openCM(c,e.clientX,e.clientY);else{cm.hidden=true;if(signAt(e.clientX,e.clientY))editSign()}});
addEventListener('pointerdown',e=>{if(!cm.hidden&&!cm.contains(e.target))cm.hidden=true},true);addEventListener('keydown',e=>{if(e.key==='Escape')cm.hidden=true});
async function loadList(){for(const u of ['/api/gatos','gatos.json?'+Date.now()]){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;const j=await r.json(),a=Array.isArray(j)?j:(j&&j.gatos);
  if(Array.isArray(a)&&a.length&&a.every(Array.isArray)){if(j&&typeof j.mundo==='string'&&j.mundo.trim())WORLD=j.mundo.trim().slice(0,40);return a}}catch(e){}}return DATA}
SHEET.onload=()=>{initSheet();resize();loadList().then(L=>{Rt=Math.max(9,Math.sqrt(L.length)*1.1+5);build();L.forEach(r=>spawn(r));last=performance.now();requestAnimationFrame(frame)})};SHEET.src=SHEET_SRC;
</script>
